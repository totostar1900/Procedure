# Publication automatique : applique au dépôt les modifications faites en ligne (brouillons soumis)
# et adopte les documents dont le circuit d'approbation est complet (passage en vigueur, v1.0),
# régénère le site, les PDF et les Word, puis marque les demandes comme traitées.
# Déclenché par le site (soumission d'un brouillon, dernier visa d'un circuit), et chaque heure en secours.
name: Appliquer les modifications en ligne
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://qrmoozapvnfmbtibofup.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Y a-t-il des modifications ou des adoptions en attente ?
        id: n
        run: |
          q() { curl -sf "$SUPABASE_URL/rest/v1/kv?select=path&$1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | grep -o '"path"' | wc -l; }
          a=$(q "path=like.redaction%2F*&data->>statut=eq.soumis"); b=$(q "path=like.adoptions%2F*&data->>statut=eq.demande")
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$a$b" = "00" ]; then n=0; else n=$((a+b+1)); fi
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "$a modification(s) soumise(s), $b demande(s) d'adoption"
      - if: steps.n.outputs.n != '0'
        uses: actions/checkout@v4
      - if: steps.n.outputs.n != '0'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.n.outputs.n != '0'
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.n.outputs.n != '0'
        run: node tools/appliquer.mjs && node tools/adopter-auto.mjs
      - if: steps.n.outputs.n != '0'
        run: node build.mjs
      - if: steps.n.outputs.n != '0'
        name: Enregistrer
        run: |
          git config user.name "Publication référentiel"
          git config user.email "actions@users.noreply.github.com"
          git add -A content dist
          if git diff --cached --quiet; then echo "Rien à enregistrer"; else git commit -m "Publication automatique : $(node -e 'const r=(f)=>{try{return require(f)}catch{return []}};console.log([...r("./build/appliques.json").map(a=>a.id+" v"+a.version+" modifié"),...r("./build/adoptes.json").map(a=>a.id+" v"+a.version+" adopté")].join(", ")||"régénération")')" && git push; fi
      - if: steps.n.outputs.n != '0'
        run: node tools/appliquer.mjs --confirmer && node tools/adopter-auto.mjs --confirmer
