glossaire:
  - terme: Bénéficiaire effectif
    definition: Personne physique qui, en dernier lieu, possède ou contrôle le client, ou pour le compte de laquelle une opération est effectuée.
  - terme: Collaborateur
    definition: Toute personne agissant pour le compte de la Société — administrateur, dirigeant, salarié, stagiaire, intérimaire, prestataire ou mandataire.
  - terme: Conflit d'intérêts
    definition: Situation dans laquelle l'intérêt de la Société, d'un Collaborateur ou d'un client peut s'opposer à l'intérêt d'un autre client.
  - terme: Arrangeur
    definition: Société de bourse mandatée par un émetteur pour structurer une levée de fonds, préparer le dossier de visa et organiser le placement des titres.
  - terme: Document d'information
    definition: Prospectus décrivant l'émetteur et l'opération, soumis au visa de la COSUMAF avant toute diffusion au public.
  - terme: Fenêtre négative
    definition: Période pendant laquelle les Collaborateurs s'abstiennent de toute opération personnelle sur un titre donné.
  - terme: Front running
    definition: Exécution d'un ordre pour compte propre ou personnel avant un ordre client portant sur le même titre, pour profiter de son impact sur le cours.
  - terme: Garantie de bonne fin
    definition: Engagement d'un intermédiaire de souscrire ou de faire souscrire les titres non placés à l'issue de la période de souscription.
  - terme: Information privilégiée
    definition: Information précise, non publique, concernant un émetteur ou un titre, susceptible d'influencer sensiblement son cours si elle était rendue publique.
  - terme: Muraille de Chine
    definition: Ensemble de mesures organisationnelles et informatiques empêchant la circulation d'informations sensibles entre activités séparées.
  - terme: Opération personnelle
    definition: Toute opération sur instrument financier réalisée par un Collaborateur pour son compte, celui de son conjoint, de ses enfants à charge ou de toute personne interposée.
  - terme: Personne politiquement exposée (PPE)
    definition: Personne qui exerce ou a exercé une fonction publique importante, ainsi que les membres de sa famille et ses proches associés.
  - terme: Prise ferme
    definition: Souscription par l'intermédiaire de la totalité ou d'une partie des titres dès l'émission, avant leur revente aux investisseurs ; elle engage ses fonds propres.
  - terme: RCCI
    definition: Responsable de la conformité et du contrôle interne ; titulaire de la fonction déontologique, nommé par le Conseil d'Administration et notifié à la COSUMAF.
  - terme: Syndicat de placement
    definition: Groupement de sociétés de bourse et d'établissements de crédit constitué par le chef de file pour placer les titres d'une émission.
  - terme: Version maîtrisée
    definition: Version d'un document publiée dans le référentiel en ligne ; seule elle fait foi. Toute copie imprimée ou téléchargée est réputée non maîtrisée.
