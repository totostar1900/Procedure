# Paramètres généraux du référentiel documentaire — Purpose Capital S.A.
# Les rôles sont désignés par leur titre, jamais par le nom de la personne.

societe:
  raison_sociale: Purpose Capital S.A.
  forme: Société anonyme avec Conseil d'Administration
  agrement: COSUMAF-SDB-01/2026
  capital: 317 500 000 FCFA
  siege: Rue Joseph Essono Balla, Elig-Essono, Yaoundé (Cameroun)
  rccm:            # à renseigner une fois : repris automatiquement dans les conventions

# Circuit d'approbation par niveau documentaire
niveaux:
  - type: Code
    prefixe: COD
    redaction: RCCI
    verification: Directeur Général
    approbation: Conseil d'Administration
    revue: Annuelle
  - type: Politique
    prefixe: POL
    redaction: Propriétaire du domaine
    verification: RCCI
    approbation: Conseil d'Administration
    revue: Annuelle
  - type: Procédure
    prefixe: PRO
    redaction: Responsable du processus
    verification: RCCI
    approbation: Directeur Général
    revue: 1 à 2 ans
  - type: Modèle de contrat
    prefixe: CTR
    redaction: Directeur de la direction concernée
    verification: RCCI et conseil juridique
    approbation: Directeur Général
    revue: Annuelle
  - type: Mode opératoire
    prefixe: MOP
    redaction: Responsable du service
    verification: RCCI
    approbation: Responsable du service
    revue: Au fil de l'eau
  - type: Formulaire
    prefixe: FRM
    redaction: Propriétaire du document parent
    verification: RCCI
    approbation: Approbateur du document parent
    revue: Avec le document parent

