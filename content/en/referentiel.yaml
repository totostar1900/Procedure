# General parameters of the document repository — Purpose Capital S.A. (English courtesy translation)
# Roles are designated by their title, never by the person's name.

societe:
  forme: "Public limited company (société anonyme) with a Board of Directors"
  siege: "Rue Joseph Essono Balla, Elig-Essono, Yaoundé (Cameroon)"

# Approval workflow by document level
niveaux:
  - type: "Code"
    prefixe: "COD"
    redaction: "RCCI"
    verification: "Chief Executive Officer"
    approbation: "Board of Directors"
    revue: "Annual"
  - type: "Policy"
    prefixe: "POL"
    redaction: "Domain owner"
    verification: "RCCI"
    approbation: "Board of Directors"
    revue: "Annual"
  - type: "Procedure"
    prefixe: "PRO"
    redaction: "Process owner"
    verification: "RCCI"
    approbation: "Chief Executive Officer"
    revue: "Every 1 to 2 years"
  - type: "Contract template"
    prefixe: "CTR"
    redaction: "Head of the department concerned"
    verification: "RCCI and legal counsel"
    approbation: "Chief Executive Officer"
    revue: "Annual"
  - type: "Operating instructions"
    prefixe: "MOP"
    redaction: "Head of the unit"
    verification: "RCCI"
    approbation: "Head of the unit"
    revue: "As needed"
  - type: "Form"
    prefixe: "FRM"
    redaction: "Owner of the parent document"
    verification: "RCCI"
    approbation: "Approver of the parent document"
    revue: "With the parent document"

