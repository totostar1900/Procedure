glossaire:
  - terme: "Beneficial owner"
    definition: "The natural person who ultimately owns or controls the client, or on whose behalf a transaction is carried out."
  - terme: "Staff Member"
    definition: "Any person acting on behalf of the Company — director, senior manager, employee, intern, temporary worker, service provider or agent."
  - terme: "Conflict of interest"
    definition: "A situation in which the interest of the Company, of a Staff Member or of a client may conflict with the interest of another client."
  - terme: "Arranger"
    definition: "A brokerage firm appointed by an issuer to structure a fundraising, prepare the application for COSUMAF approval (visa) and organise the placement of the securities."
  - terme: "Information memorandum"
    definition: "A prospectus describing the issuer and the transaction, submitted to COSUMAF for approval (visa) before any distribution to the public."
  - terme: "Blackout period"
    definition: "A period during which Staff Members refrain from any personal transaction in a given security."
  - terme: "Front running"
    definition: "Executing an order for own or personal account ahead of a client order in the same security, in order to profit from its impact on the price."
  - terme: "Standby underwriting commitment"
    definition: "An intermediary's commitment to subscribe, or procure subscribers, for the securities not placed at the end of the subscription period."
  - terme: "Inside information"
    definition: "Information of a precise nature, not made public, relating to an issuer or a security, which would be likely to have a significant effect on its price if it were made public."
  - terme: "Chinese wall"
    definition: "A set of organisational and IT measures preventing the flow of sensitive information between separated activities."
  - terme: "Personal transaction"
    definition: "Any transaction in a financial instrument carried out by a Staff Member for their own account, for the account of their spouse, their dependent children or any intermediary person."
  - terme: "Politically exposed person (PEP)"
    definition: "A person who holds or has held a prominent public function, together with their family members and close associates."
  - terme: "Firm underwriting"
    definition: "Subscription by the intermediary for all or part of the securities at issue, before their resale to investors; it commits the intermediary's own funds."
  - terme: "RCCI"
    definition: "Head of Compliance and Internal Control; holder of the ethics (compliance) function, appointed by the Board of Directors and notified to COSUMAF."
  - terme: "Placement syndicate"
    definition: "A group of brokerage firms and credit institutions formed by the lead manager to place the securities of an issue."
  - terme: "Controlled version"
    definition: "The version of a document published in the online repository; only that version is authoritative. Any printed or downloaded copy is deemed uncontrolled."
